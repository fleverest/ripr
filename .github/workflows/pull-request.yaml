# Runs on every pull request into main.
#
#   render  - regenerates roxygen docs, README.md and the vignette HTML from
#             their sources, and commits the result back to the PR branch if
#             anything changed (fails with the diff instead for PRs from forks,
#             which the workflow token cannot push to).
#   format  - fails if any R file is not formatted with air.
#   check   - R CMD check on the branch as it stands after `render`.
#
# Commits pushed with GITHUB_TOKEN do not trigger further workflow runs, so a
# rebuilt commit carries no check runs of its own; the `check` job in this run
# covers it. To get a full run on the rebuilt commit, add a fine-grained PAT
# with contents: write as the WORKFLOW_PUSH_TOKEN secret.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: pull-request.yaml

permissions: read-all

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::rmarkdown, local::.

      - name: Build roxygen2 documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      # Reinstall so README and vignettes render against the documented package.
      - name: Reinstall package
        run: R CMD INSTALL --no-multiarch .

      - name: Build README
        run: rmarkdown::render("README.Rmd", quiet = TRUE)
        shell: Rscript {0}

      - name: Build vignettes
        run: |
          for (rmd in list.files("vignettes", pattern = "\\.Rmd$", full.names = TRUE)) {
            rmarkdown::render(rmd, output_dir = "vignettes", quiet = TRUE)
          }
        shell: Rscript {0}

      - name: Commit rebuilt files
        run: |
          git add DESCRIPTION NAMESPACE man README.md vignettes/*.html
          if git diff --cached --quiet; then
            echo "Documentation, README and vignettes are up to date."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Rebuilt files differ but this PR comes from a fork; rebuild locally and push."
            git --no-pager diff --cached --stat
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Rebuild documentation, README and vignettes"
          git push

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

  check:
    needs: render
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
