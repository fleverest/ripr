url: https://fleverest.github.io/ripr/

template:
  bootstrap: 5

reference:
- title: Spaces
  desc: >
    A `space` is a set a measure can live on. Every space says how many
    coordinates one of its elements carries and whether a given point is one of
    them; a finite one can also list them all.
  contents:
  - space
  - space_dim
  - contains
  - validate_outcome
  - enumerate_space
  - is_finite_space
  - count_space

- title: Observation models
  desc: >
    A `parametric_family` owns the model `p_theta(x)`: a compiled
    log-likelihood, score and sampler over a sample space.
  contents:
  - parametric_family
  - multinomial_family
  - gaussian_family
  - compile_loglik
  - kernel_loglik
  - kernel_loglik_batch
  - score
  - kernel_draw

- title: Regions
  desc: >
    Subsets of the real numbers that carry convex geometry. A `convex_region`
    can be charted, projected onto, and searched by an optimiser; a
    `union_region` is a finite union of them and need not be convex, and its
    parts may overlap.  Every region answers `parts()` for what it was declared
    as and `cells()` for a triangulation of its parts.
  contents:
  - region
  - convex_region
  - union_region
  - empty_region
  - polyhedron_region
  - h_region
  - polytope_region
  - simplex_region
  - halfspace_region
  - point_region
  - real_region
  - chart
  - project
  - init_point
  - parts
  - n_parts
  - cells
  - n_cells
  - region_dim
  - is_empty
  - is_bounded

- title: Set algebra
  desc: >
    Operations that build new regions from old ones, and decide questions
    about them, composed in exact rational arithmetic and converted to doubles
    once per chain.
  contents:
  - region_algebra
  - disjoin

- title: Null hypotheses
  desc: >
    A null is a family together with a finite union of convex parameter
    regions.
  contents:
  - null_model
  - in_null

- title: Distributions
  desc: >
    A `distribution` is a law over a `space`. Pushing one over a parameter space
    through a family's kernel induces a mixture distribution over the family's
    sample space.
  contents:
  - distribution
  - log_density
  - draw
  - family.distribution
  - mixture
  - discrete_dist
  - dirac
  - finite_dist
  - continuous_dist
  - gaussian_dist
  - dirichlet
  - n_atoms
  - atoms
  - weights.distribution
  - discretise
  - prune
  - reference_point

- title: Random variables
  desc: >
    Callable variables on a sample space, with arithmetic for building
    likelihood ratios.
  contents:
  - random_variable
  - likelihood
  - random_variable_arithmetic

- title: Quadrature engines
  desc: >
    Expectations under the alternative are approximated by a `quadrature`
    rule: exact enumeration, Monte Carlo, or Gauss-Hermite.
  contents:
  - quadrature
  - n_nodes
  - deterministic
  - compile_engine
  - expect_q
  - log_expect_q
  - expect_se
  - exact_engine
  - mc_engine
  - gh_engine
  - resolve_engine

- title: Fitting the RIPr
  desc: >
    `ripr_init()` builds a starting state; the step verbs advance it by
    Frank--Wolfe, Li--Barron and/or EM; `ripr_finish()` turns it into a
    distribution.
  contents:
  - ripr_control
  - ripr_state
  - ripr_init
  - oracles
  - fw_step
  - lb_step
  - em_step
  - weight_step
  - predicates
  - ripr_finish
  - flat_atoms
  - flat_weights

- title: Certification
  desc: >
    Proving (or searching for) an upper bound on the null expectation of a
    random variable, to correct a fitted ratio into a genuine e-variable.
  contents:
  - certify
  - certify_trace
  - sup_lb
