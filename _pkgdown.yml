url: https://fleverest.github.io/ripr/

template:
  bootstrap: 5

reference:
- title: Sample spaces
  desc: >
    A `sample_space` owns the set an observation is drawn from: its dimension,
    which objects are elements of it, and (when finite) all of them.
  contents:
  - sample_space
  - count_space
  - real_space
  - space_dim
  - validate_outcome
  - enumerate_space
  - is_finite_space

- title: Observation models
  desc: >
    A `parametric_family` owns the model `p_theta(x)`: a compiled
    log-likelihood, score and sampler over a sample space.
  contents:
  - parametric_family
  - multinomial_family
  - gaussian_family
  - compile_loglik
  - kernel_loglik
  - kernel_loglik_batch
  - score
  - kernel_draw

- title: Regions
  desc: >
    A `region` is any subset of a family's parameter space. A `convex_region`
    is one that is convex, and handles the geometry: membership, projection,
    and an unconstrained chart / coordinate system for optimisation. A
    `union_region` is a finite union of them, and need not be convex; its cells
    may overlap.  Every region answers `parts()` for what it was declared as and
    `cells()` for what the algorithms decompose it into.
  contents:
  - region
  - convex_region
  - union_region
  - polyhedron_region
  - h_region
  - polytope_region
  - simplex_region
  - halfspace_region
  - point_region
  - unconstrained_region
  - chart
  - contains
  - project
  - init_point
  - parts
  - n_parts
  - cells
  - n_cells
  - is_empty
  - is_bounded

- title: Set algebra
  desc: >
    Operations that build new regions from old ones, and decide questions
    about them, composed in exact rational arithmetic and converted to doubles
    once per chain.
  contents:
  - region_algebra
  - disjoin

- title: Null hypotheses
  desc: >
    A null is a family together with a finite union of convex parameter
    regions.
  contents:
  - null_model
  - in_null

- title: Distributions
  desc: >
    A `distribution` is a law over a sample space, and a `mixing_measure` is a
    law over a parameter space. Pushing the latter through a family's kernel
    induces the former.
  contents:
  - distribution
  - log_density
  - draw
  - family.distribution
  - induced_distribution
  - mixing_measure
  - point_mixing
  - finite_mixing
  - gaussian_mixing
  - n_atoms
  - atoms
  - weights.mixing_measure
  - prune
  - mode_parameter

- title: Random variables
  desc: >
    Callable variables on a sample space, with arithmetic for building
    likelihood ratios.
  contents:
  - random_variable
  - likelihood
  - random_variable_arithmetic

- title: Quadrature engines
  desc: >
    Expectations under the alternative are approximated by a `quadrature`
    rule: exact enumeration, Monte Carlo, or Gauss-Hermite.
  contents:
  - quadrature
  - n_nodes
  - deterministic
  - compile_engine
  - expect_q
  - log_expect_q
  - expect_se
  - exact_engine
  - mc_engine
  - gh_engine
  - resolve_engine

- title: Fitting the RIPr
  desc: >
    `ripr_init()` builds a starting state; the step verbs advance it by
    Frank--Wolfe, Li--Barron and/or EM; `ripr_finish()` turns it into a
    distribution.
  contents:
  - ripr_control
  - ripr_state
  - ripr_init
  - oracles
  - fw_step
  - lb_step
  - em_step
  - weight_step
  - predicates
  - ripr_finish
  - flat_atoms
  - flat_weights

- title: Certification
  desc: >
    Proving (or searching for) an upper bound on the null expectation of a
    random variable, to correct a fitted ratio into a genuine e-variable.
  contents:
  - certify
  - certify_trace
  - sup_lb
